name: rbwa
description: "Read Book With AI - native AI-integrated local document reader"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Rust FFI bridge (version must match rust/Cargo.toml + codegen 2.12.0)
  flutter_rust_bridge: 2.12.0

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Window / desktop
  window_manager: ^0.4.3
  file_picker: ^8.1.6

  # Rendering (AI answers: Markdown)
  flutter_markdown: ^0.7.4+3

  # Path utilities (app data dir)
  path: ^1.9.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
