[package]
name = "rbwa_core"
version = "0.1.0"
edition = "2021"
description = "RBWA Rust core layer - PDF/OCR/AI/DB heavy lifting for the Flutter UI"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "rbwa_core"
crate-type = ["cdylib", "staticlib", "rlib"]

# ---------------------------------------------------------------------------
# Dependency strategy
# ---------------------------------------------------------------------------
# Dependencies are declared only when actually exercised by the code
# (flutter_rust_bridge, rusqlite, tokio, thiserror, tracing, serde, dirs).
# Subsystem crates (pdfium-render, reqwest, image) are gated behind cargo
# features per milestone (M2-M6). rapidocr-core is intentionally omitted
# until M5 because its API is still young; we will pin a version then.
# ---------------------------------------------------------------------------

[dependencies]
# FFI bridge - version MUST match pubspec.yaml flutter_rust_bridge + codegen 2.12.0
flutter_rust_bridge = "=2.12.0"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs"] }
tokio-stream = "0.1"
futures-core = "0.3"
futures-util = "0.3"

# Database - bundled SQLite (WAL) + FTS5
rusqlite = { version = "0.32", features = ["bundled", "blob"] }

# PDF rendering / text extraction (M2)
pdfium-render = { version = "0.9", features = ["image_latest", "thread_safe"], optional = true }

# AI client - OpenAI-compatible streaming + vision (M4).
# Transport is a hand-written reqwest SSE client (TECH_ROADMAP fallback:
# async-openai's request types serialize fields providers reject, e.g.
# `image_url.detail: null`), so only reqwest is needed.
# async-openai = { version = "0.27", optional = true }

# Image processing - thumbnails (M2)
image = { version = "0.25", optional = true }

# HTTP - AI fallback / model download (M4/M5)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"], optional = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Base64 for vision screenshots (data URL, M4)
base64 = "0.22"

# SHA-256 for region OCR cache keys (7.2.3: screenshot content de-dup)

# SSE byte stream chunks for the hand-written streaming client (M4)
bytes = "1"

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# App data directory resolution
dirs = "5"

# Misc
uuid = { version = "1", features = ["v4"] }

[features]
default = ["pdf", "ai"]
# Opt-in subsystem crates, enabled per milestone to keep the build lean.
pdf = ["dep:pdfium-render", "dep:image"]
# M4: AI streaming client. `image` provides PNG encoding for vision screenshots.
ai = ["dep:reqwest", "dep:image"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
